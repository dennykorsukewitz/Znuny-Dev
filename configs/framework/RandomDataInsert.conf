#     --generate-users 5 \
#     --generate-customer-users 6 \
#     --generate-customer-companies 2 \
#     --generate-groups 3 \
#     --generate-queues 5

GENERATE_TICKETS=10
ARTICLES_PER_TICKET=5
GENERATE_USERS=5
GENERATE_CUSTOMER_USERS=6
