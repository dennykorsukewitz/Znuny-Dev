---
name: Lint
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  Lint:
  #   uses: dennykorsukewitz/dennykorsukewitz/.github/workflows/reusable.lint.yml@dev
  #   with:
  #     USE_FIND_ALGORITHM: false
  #     VALIDATE_TYPESCRIPT_STANDARD: false
  # Lint-Legacy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Super-Linter
        uses: super-linter/super-linter@v8.5.0
        env:
          # USE_FIND_ALGORITHM=false: Git-basiert, damit DEFAULT_BRANCH genutzt wird (sonst Validierungsfehler)
          USE_FIND_ALGORITHM: false
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
