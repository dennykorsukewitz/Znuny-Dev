# Znuny Development Environment Apache Virtual Host Configuration
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /opt/znuny

    # Enable mod_perl
    PerlRequire /opt/znuny/scripts/apache2-perl-startup.pl

    # Main Znuny application
    <Location />
        SetHandler perl-script
        PerlResponseHandler Plack::Handler::Apache2
        PerlSetVar psgi_app /opt/znuny/bin/psgi-bin/znuny.psgi
    </Location>

    # Static files
    <LocationMatch "\.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$">
        SetHandler default-handler
        ExpiresActive On
        ExpiresDefault "access plus 1 month"
    </LocationMatch>

    # Znuny Console access
    <Location /znuny.Console.pl>
        SetHandler perl-script
        PerlResponseHandler ModPerl::Registry
        Options +ExecCGI
    </Location>

    # Fred debugging interface
    <Location /Fred>
        SetHandler perl-script
        PerlResponseHandler ModPerl::Registry
        Options +ExecCGI
    </Location>

    # Error and access logs
    ErrorLog /var/log/apache2/znuny_error.log
    CustomLog /var/log/apache2/znuny_access.log combined

    # Security headers
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY
    Header always set X-XSS-Protection "1; mode=block"

    # Enable compression
    LoadModule deflate_module modules/mod_deflate.so
    <Location />
        SetOutputFilter DEFLATE
        SetEnvIfNoCase Request_URI \
            \.(?:gif|jpe?g|png)$ no-gzip dont-vary
        SetEnvIfNoCase Request_URI \
            \.(?:exe|t?gz|zip|bz2|sit|rar)$ no-gzip dont-vary
    </Location>
</VirtualHost>

# HTTPS Virtual Host (for development with self-signed certificates)
<VirtualHost *:443>
    ServerName localhost
    DocumentRoot /opt/znuny

    # SSL Configuration
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/ssl-cert-snakeoil.pem
    SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key

    # Enable mod_perl
    PerlRequire /opt/znuny/scripts/apache2-perl-startup.pl

    # Main Znuny application
    <Location />
        SetHandler perl-script
        PerlResponseHandler Plack::Handler::Apache2
        PerlSetVar psgi_app /opt/znuny/bin/psgi-bin/znuny.psgi
    </Location>

    # Static files
    <LocationMatch "\.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$">
        SetHandler default-handler
        ExpiresActive On
        ExpiresDefault "access plus 1 month"
    </LocationMatch>

    # Znuny Console access
    <Location /znuny.Console.pl>
        SetHandler perl-script
        PerlResponseHandler ModPerl::Registry
        Options +ExecCGI
    </Location>

    # Fred debugging interface
    <Location /Fred>
        SetHandler perl-script
        PerlResponseHandler ModPerl::Registry
        Options +ExecCGI
    </Location>

    # Error and access logs
    ErrorLog /var/log/apache2/znuny_ssl_error.log
    CustomLog /var/log/apache2/znuny_ssl_access.log combined

    # Security headers
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
</VirtualHost>
