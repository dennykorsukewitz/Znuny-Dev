<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Znuny Development — instances</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet"/>
  <link rel="preload" href="/versabackground.svg" as="image" type="image/svg+xml"/>
  <link rel="stylesheet" href="/app.css"/>
</head>
<body class="font-open">
  <div id="global-message-panel" class="zd-messages" hidden aria-hidden="true" aria-live="polite"></div>
  <div class="page">
    <div class="container">
      <header class="hero">
        <div class="hero-inner">
          <div class="hero-left">
            <h1><a href="#" class="site-title-link" id="site-title-reload">Znuny Development</a></h1>
            <p class="hero-sub">Local development instances</p>
            <p class="hero-meta" id="generated-at"></p>
          </div>
          <div class="hero-toolbar" id="instances-toolbar">
            <div class="toolbar-group view-switch" role="group" aria-label="Layout">
              <span class="toolbar-label">View</span>
              <button type="button" id="view-cards" class="segment segment-active" aria-pressed="true">Cards</button>
              <button type="button" id="view-table" class="segment" aria-pressed="false">Table</button>
            </div>
            <div class="toolbar-group sort-group">
              <label class="toolbar-label" for="sort-key">Sort</label>
              <select id="sort-key" class="toolbar-select" aria-label="Sort by">
                <option value="name">Name</option>
                <option value="instance">Instance</option>
                <option value="database">Database</option>
                <option value="created">Created</option>
                <option value="status">Status</option>
                <option value="port">Port</option>
              </select>
              <select id="sort-dir" class="toolbar-select" aria-label="Sort direction">
                <option value="asc">Ascending</option>
                <option value="desc">Descending</option>
              </select>
            </div>
          </div>
          <div class="hero-actions">
            <button type="button" id="btn-refresh" class="btn btn-primary">Refresh</button>
            <label class="toggle-switch toggle-switch-theme" for="theme-toggle">
              <input type="checkbox" id="theme-toggle" aria-label="Switch to dark theme"/>
              <span class="toggle-track-theme" aria-hidden="true">
                <span class="toggle-theme-slot toggle-theme-slot-sun" aria-hidden="true">
                  <svg class="toggle-theme-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
                  </svg>
                </span>
                <span class="toggle-theme-slot toggle-theme-slot-moon" aria-hidden="true">
                  <svg class="toggle-theme-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                  </svg>
                </span>
                <span class="toggle-theme-thumb" aria-hidden="true">
                  <span class="toggle-theme-thumb-icon toggle-theme-thumb-icon-sun" aria-hidden="true">
                    <svg class="toggle-theme-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
                      <circle cx="12" cy="12" r="4"/>
                      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
                    </svg>
                  </span>
                  <span class="toggle-theme-thumb-icon toggle-theme-thumb-icon-moon" aria-hidden="true">
                    <svg class="toggle-theme-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                  </span>
                </span>
              </span>
            </label>
            <button type="button" id="btn-status-legend" class="hero-help-btn" aria-label="Status legend">
              <span class="hero-help-icon" aria-hidden="true">?</span>
            </button>
          </div>
        </div>
      </header>

      <p class="error-banner" id="error-banner" hidden></p>

      <div id="status-legend-dialog" class="confirm-dialog status-legend-dialog" hidden role="dialog" aria-modal="true" aria-labelledby="status-legend-dialog-title">
        <div class="confirm-dialog-backdrop" data-legend-close="1"></div>
        <div class="confirm-dialog-panel status-legend-dialog-panel">
          <h2 id="status-legend-dialog-title" class="confirm-dialog-title">Status legend</h2>
          <div class="status-legend-body" id="status-legend-body" aria-label="Instance and container status meanings"></div>
          <div class="confirm-dialog-actions">
            <button type="button" class="btn btn-secondary" data-legend-close="1">Close</button>
          </div>
        </div>
      </div>

      <div id="confirm-dialog" class="confirm-dialog" hidden role="dialog" aria-modal="true" aria-labelledby="confirm-dialog-title">
        <div class="confirm-dialog-backdrop" data-confirm="0"></div>
        <div class="confirm-dialog-panel">
          <h2 id="confirm-dialog-title" class="confirm-dialog-title">Delete instance?</h2>
          <p id="confirm-dialog-message" class="confirm-dialog-message"></p>
          <div class="confirm-dialog-actions">
            <button type="button" class="btn btn-secondary" data-confirm="0">Cancel</button>
            <button type="button" class="btn btn-danger" data-confirm="1">Delete</button>
          </div>
        </div>
      </div>

      <section id="instances" class="instances-view" aria-live="polite"></section>

      <footer class="site-footer">
        <p>Znuny Development Environment · <a href="https://www.znuny.com/en" target="_blank" rel="noopener">Znuny</a> · Powered by <a href="https://www.docker.com/" target="_blank" rel="noopener">Docker</a> · Repository: <a href="https://github.com/dennykorsukewitz/Znuny-Dev" target="_blank" rel="noopener">Znuny-Dev</a></p>
      </footer>
    </div>
  </div>

  <!-- Mock /api/status for UI testing: uncomment the next line (before app.js) -->
  <!-- <script src="/mock-status-data.js"></script> -->
  <script src="/app.js"></script>
</body>
</html>
