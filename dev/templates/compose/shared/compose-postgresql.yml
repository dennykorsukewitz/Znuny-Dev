# Znuny Framework Instance – Shared Mode (PostgreSQL)
# Includes shared DB container; first instance start creates DB + network, further instances only add their app.

services:
  znuny-postgresql:
    image: postgres:15
    container_name: znuny-postgresql
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_shared}
    volumes:
      - znuny-postgresql-data:/var/lib/postgresql/data
    networks:
      - znuny-network
    restart: unless-stopped

  znuny-${FRAMEWORK_SLUG}-instance:
    build:
      context: ../..
      dockerfile: dev/docker/Dockerfile
    image: znuny-${FRAMEWORK_SLUG}-instance
    container_name: znuny-${FRAMEWORK_SLUG}-instance
    ports:
      - "${FRAMEWORK_PORT}:80"
    volumes:
      - {{FRAMEWORKS_DIR}}/${FRAMEWORK_NAME}:/opt/znuny:rw
      - {{PACKAGES_DIR}}:/opt/packages:rw
      - {{TOOLS_DIR}}:/opt/tools:rw
      - ${FRAMEWORK_SLUG}-data:/var/lib/znuny
      - {{INSTANCES_DIR}}/{{FRAMEWORK_NAME}}/logs:/var/log/apache2:rw
      - {{INSTANCES_DIR}}/{{FRAMEWORK_NAME}}/logs:/opt/znuny/var/log:rw
      - {{CONFIGS_DIR}}:/etc/znuny/configs:ro
      - {{FRAMEWORK_CONFIGS_DIR}}:/opt/framework-config:ro
    env_file:
      - ./${FRAMEWORK_NAME}.env
    environment:
      - BASE_PORT=${BASE_PORT:-10000}
      - DB_TYPE=${DB_TYPE:-postgresql}
      - DB_HOST=${DB_HOST:-znuny-postgresql}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-${FRAMEWORK_NAME}}
      - DB_USER=${DB_USER:-${FRAMEWORK_NAME}}
      - DB_PASSWORD=${DB_PASSWORD:-${FRAMEWORK_NAME}_password}
      - POSTGRES_ROOT_PASSWORD=${POSTGRES_ROOT_PASSWORD:-${POSTGRES_PASSWORD:-postgres_shared}}
      - ZNUNY_PORT=${FRAMEWORK_PORT}
      - FRAMEWORK_NAME=${FRAMEWORK_NAME}
    networks:
      - znuny-network
    restart: unless-stopped

volumes:
  znuny-postgresql-data:
    driver: local
  ${FRAMEWORK_SLUG}-data:
    driver: local

networks:
  znuny-network:
    name: znuny-network
    driver: bridge
