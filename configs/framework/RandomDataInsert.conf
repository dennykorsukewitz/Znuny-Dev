# RandomDataInsert — znuny-dev defaults
# Consumed by: znuny-dev.sh random-data-insert <framework>
# (when no CLI flags override; maps to Dev::Tools::Database::RandomDataInsert)
#
# Format: KEY=VALUE (non-empty lines). Booleans: 1 / true / yes enable a flag.
# Numbers: use 0 or omit to skip passing that --generate-* option (Perl defaults apply where omitted).
#
# Console reference:
#   perl bin/znuny.Console.pl Dev::Tools::Database::RandomDataInsert --help

# --- Entity name prefix (queues, users, dynamic fields, …); empty = Perl default (fill-up-)
NAME_PREFIX=zd-

# --- Tickets (required workload together with other generators if tickets = 0)
GENERATE_TICKETS=10
ARTICLES_PER_TICKET=10

# Mark generated tickets as seen by random agents (flag)
MARK_TICKETS_AS_SEEN=1

# --- Agents, customers, queues
GENERATE_USERS=5
GENERATE_CUSTOMER_USERS=6
GENERATE_CUSTOMER_COMPANIES=2
GENERATE_GROUPS=3
GENERATE_QUEUES=5

# --- Extra structure (0 = do not pass; speeds up default runs)
GENERATE_ROLES=1
GENERATE_TYPES=1
GENERATE_STATES=1
GENERATE_PRIORITIES=1
GENERATE_SERVICES=1
GENERATE_SLAS=1

# --- Optional bundles (0 = off)
GENERATE_ATTACHMENTS=1
GENERATE_CALENDARS=1

# --- Boolean console switches (1 / true / yes)
GENERATE_DYNAMICFIELDS=1
GENERATE_PROCESS=1
GENERATE_WEBSERVICE=1
