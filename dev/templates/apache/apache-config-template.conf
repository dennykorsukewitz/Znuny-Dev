# Apache Virtual Host Configuration Template for Znuny Multi-Instance Setup
# This template will be used to generate the actual Apache configuration

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    # Health check endpoint
    <Location /health>
        ProxyPass http://localhost:8080/health
        ProxyPassReverse http://localhost:8080/health
    </Location>

    # Default redirect to first available framework
    <Location />
        RewriteEngine On
        RewriteRule ^$ /znuny_dev/ [R=302,L]
    </Location>

    # Framework-specific proxy configurations
    # These will be dynamically generated based on available frameworks

    # Error and access logs
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    # Security headers
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY
    Header always set X-XSS-Protection "1; mode=block"

    # Enable compression
    LoadModule deflate_module modules/mod_deflate.so
    <Location />
        SetOutputFilter DEFLATE
        SetEnvIfNoCase Request_URI \
            \.(?:gif|jpe?g|png)$ no-gzip dont-vary
        SetEnvIfNoCase Request_URI \
            \.(?:exe|t?gz|zip|bz2|sit|rar)$ no-gzip dont-vary
    </Location>
</VirtualHost>

# HTTPS Virtual Host (if SSL is configured)
<IfModule mod_ssl.c>
    <VirtualHost *:443>
        ServerName localhost
        DocumentRoot /var/www/html

        # SSL Configuration
        SSLEngine on
        SSLCertificateFile /etc/ssl/certs/ssl-cert-snakeoil.pem
        SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key

        # Health check endpoint
        <Location /health>
            ProxyPass http://localhost:8080/health
            ProxyPassReverse http://localhost:8080/health
        </Location>

        # Default redirect to first available framework
        <Location />
            RewriteEngine On
            RewriteRule ^$ /znuny_dev/ [R=302,L]
        </Location>

        # Framework-specific proxy configurations
        # These will be dynamically generated based on available frameworks

        # Error and access logs
        ErrorLog ${APACHE_LOG_DIR}/ssl_error.log
        CustomLog ${APACHE_LOG_DIR}/ssl_access.log combined

        # Security headers
        Header always set X-Content-Type-Options nosniff
        Header always set X-Frame-Options DENY
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

        # Enable compression
        <Location />
            SetOutputFilter DEFLATE
            SetEnvIfNoCase Request_URI \
                \.(?:gif|jpe?g|png)$ no-gzip dont-vary
            SetEnvIfNoCase Request_URI \
                \.(?:exe|t?gz|zip|bz2|sit|rar)$ no-gzip dont-vary
        </Location>
    </VirtualHost>
</IfModule>
