---
name: UnitTest

# Controls when the action will run.
on:
  push:
  workflow_dispatch:

jobs:
  UnitTest:
    strategy:
      matrix:
        os: [ubuntu-24.04]
        # os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Make scripts executable
      run: |
        chmod +x znuny-dev.sh
        chmod +x dev/scripts/*.sh
        chmod +x dev/test/run.sh
        chmod +x dev/test/utils/*.sh
        chmod +x dev/test/tests/*.sh
        chmod +x dev/test/tests/instance/*.sh
        chmod +x dev/test/tests/docker/*.sh

    - name: Setup test environment
      run: |
        # Create required directories
        mkdir -p frameworks instances compose packages tools

        # Generate .env with resolved paths (raw template breaks load_environment)
        bash dev/scripts/env.sh setup-env

        # Set test mode (skips instance-create: git clone + zd create --start need Docker)
        echo "CI_MODE=true" >> .env
        export CI_MODE=true

    - name: Run tests
      run: ./dev/test/run.sh --verbose
      env:
        CI_MODE: true