---
# Znuny Framework Instance Docker Compose Configuration
# Template for PostgreSQL database instances
# This file is automatically generated by the compose generator

services:
  # Znuny ${FRAMEWORK_NAME} Instance
  znuny-${FRAMEWORK_SLUG}-instance:
    build:
      context: ../..
      dockerfile: dev/docker/Dockerfile
    image: znuny-${FRAMEWORK_SLUG}-instance
    container_name: znuny-${FRAMEWORK_SLUG}-instance
    ports:
      - "${FRAMEWORK_PORT}:80"
    volumes:
      # Framework volume - mount ${FRAMEWORK_NAME}
      - "{{FRAMEWORKS_DIR}}/${FRAMEWORK_NAME}:/opt/znuny:rw"
      # Packages volume
      - "{{PACKAGES_DIR}}:/opt/packages:rw"
      # Tools volumes
      - "{{TOOLS_DIR}}:/opt/tools:rw"
      # Persistent data volumes
      - ${FRAMEWORK_SLUG}-data:/var/lib/znuny
      - "{{INSTANCES_DIR}}/{{FRAMEWORK_NAME}}/logs:/var/log/apache2:rw"
      - "{{INSTANCES_DIR}}/{{FRAMEWORK_NAME}}/logs:/opt/znuny/var/log:rw"
      # Configuration volumes
      - "{{CONFIGS_DIR}}:/etc/znuny/configs:ro"
      - "{{FRAMEWORK_CONFIGS_DIR}}:/opt/framework-config:ro"
    env_file:
      - ./${FRAMEWORK_NAME}.env
    environment:
      - BASE_PORT=${BASE_PORT:-10000}
      # Database configuration for ${FRAMEWORK_NAME} instance
      - DB_TYPE=${DB_TYPE:-postgresql}
      - DB_HOST=${DB_HOST:-znuny-${FRAMEWORK_SLUG}-postgresql}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-${FRAMEWORK_NAME}}
      - DB_USER=${DB_USER:-${FRAMEWORK_NAME}}
      - DB_PASSWORD=${DB_PASSWORD:-${FRAMEWORK_NAME}_password}
      # Znuny configuration
      - ZNUNY_PORT=${FRAMEWORK_PORT}
      # Environment-specific settings
      - FRAMEWORK_NAME=${FRAMEWORK_NAME}
      - ZNUNY_USE_MOD_PERL=${ZNUNY_USE_MOD_PERL:-false}
      - HOST_UID=${HOST_UID:-}
      - HOST_GID=${HOST_GID:-}
    depends_on:
      - znuny-${FRAMEWORK_SLUG}-postgresql
    networks:
      - znuny-${FRAMEWORK_SLUG}-network
    restart: unless-stopped

  # ===== DATABASE SERVICES FOR ${FRAMEWORK_NAME} INSTANCE =====

  # PostgreSQL for ${FRAMEWORK_NAME} Instance
  znuny-${FRAMEWORK_SLUG}-postgresql:
    image: postgres:15
    container_name: znuny-${FRAMEWORK_SLUG}-postgresql
    ports:
      - "${POSTGRESQL_PORT}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-${FRAMEWORK_NAME}}
      - POSTGRES_USER=${POSTGRES_USER:-${FRAMEWORK_NAME}}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-${FRAMEWORK_NAME}_password}
      - >-
        POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - ${FRAMEWORK_SLUG}-postgresql-data:/var/lib/postgresql/data
      - "{{CONFIGS_DIR}}/postgresql:/etc/postgresql:ro"
    networks:
      - znuny-${FRAMEWORK_SLUG}-network
    restart: unless-stopped

# Named volumes for persistent data
volumes:
  # ${FRAMEWORK_NAME} instance volumes
  ${FRAMEWORK_SLUG}-data:
    driver: local
  ${FRAMEWORK_SLUG}-postgresql-data:
    driver: local

# Network configuration
networks:
  znuny-${FRAMEWORK_SLUG}-network:
    name: znuny-${FRAMEWORK_SLUG}-network
    external: true
