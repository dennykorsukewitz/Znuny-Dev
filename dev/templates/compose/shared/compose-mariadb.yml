# Znuny Framework Instance – Shared Mode (MariaDB)
# Includes shared DB container; first instance start creates DB + network, further instances only add their app.

services:
  znuny-mariadb:
    image: mariadb:10.11
    container_name: znuny-mariadb
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:-root}
      - MYSQL_CHARSET=utf8mb4
      - MYSQL_COLLATION=utf8mb4_unicode_ci
    volumes:
      - znuny-mariadb-data:/var/lib/mysql
    networks:
      - znuny-network
    restart: unless-stopped

  znuny-${FRAMEWORK_SLUG}-instance:
    build:
      context: ../..
      dockerfile: dev/docker/Dockerfile
    image: znuny-${FRAMEWORK_SLUG}-instance
    container_name: znuny-${FRAMEWORK_SLUG}-instance
    ports:
      - "${FRAMEWORK_PORT}:80"
    volumes:
      - {{FRAMEWORKS_DIR}}/${FRAMEWORK_NAME}:/opt/znuny:rw
      - {{PACKAGES_DIR}}:/opt/packages:rw
      - {{TOOLS_DIR}}:/opt/tools:rw
      - ${FRAMEWORK_SLUG}-data:/var/lib/znuny
      - {{INSTANCES_DIR}}/{{FRAMEWORK_NAME}}/logs:/var/log/apache2:rw
      - {{INSTANCES_DIR}}/{{FRAMEWORK_NAME}}/logs:/opt/znuny/var/log:rw
      - {{CONFIGS_DIR}}:/etc/znuny/configs:ro
      - {{FRAMEWORK_CONFIGS_DIR}}:/opt/framework-config:ro
    env_file:
      - ./${FRAMEWORK_NAME}.env
    environment:
      - BASE_PORT=${BASE_PORT:-10000}
      - DB_TYPE=${DB_TYPE:-mariadb}
      - DB_HOST=${DB_HOST:-znuny-mariadb}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-${FRAMEWORK_NAME}}
      - DB_USER=${DB_USER:-${FRAMEWORK_NAME}}
      - DB_PASSWORD=${DB_PASSWORD:-${FRAMEWORK_NAME}}
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:-root}
      - ZNUNY_PORT=${FRAMEWORK_PORT}
      - FRAMEWORK_NAME=${FRAMEWORK_NAME}
    depends_on:
      - znuny-mariadb
    networks:
      - znuny-network
    restart: unless-stopped

volumes:
  znuny-mariadb-data:
    driver: local
  ${FRAMEWORK_SLUG}-data:
    driver: local

networks:
  znuny-network:
    name: znuny-network
    driver: bridge
