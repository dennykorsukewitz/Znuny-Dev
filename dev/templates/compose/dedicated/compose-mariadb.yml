---
# Znuny Framework Instance Docker Compose Configuration
# Template for MariaDB database instances
# This file is automatically generated by the compose generator

services:
  # Znuny ${FRAMEWORK_NAME} Instance
  znuny-${FRAMEWORK_SLUG}-instance:
    build:
      context: ../..
      dockerfile: dev/docker/Dockerfile
    image: znuny-${FRAMEWORK_SLUG}-instance
    container_name: znuny-${FRAMEWORK_SLUG}-instance
    ports:
      - "${FRAMEWORK_PORT}:80"
    volumes:
      # Framework volume - mount ${FRAMEWORK_NAME}
      - "{{FRAMEWORKS_DIR}}/${FRAMEWORK_NAME}:/opt/znuny:rw"
      # Packages volume
      - "{{PACKAGES_DIR}}:/opt/packages:rw"
      # Tools volumes
      - "{{TOOLS_DIR}}:/opt/tools:rw"
      # Persistent data volumes
      - ${FRAMEWORK_SLUG}-data:/var/lib/znuny
      - "{{INSTANCES_DIR}}/{{FRAMEWORK_NAME}}/logs:/var/log/apache2:rw"
      - "{{INSTANCES_DIR}}/{{FRAMEWORK_NAME}}/logs:/opt/znuny/var/log:rw"
      - "{{CONFIGS_DIR}}:/etc/znuny/configs:ro"
      - "{{FRAMEWORK_CONFIGS_DIR}}:/opt/framework-config:ro"
    env_file:
      - ./${FRAMEWORK_NAME}.env
    environment:
      - BASE_PORT=${BASE_PORT:-10000}
      # Database configuration for ${FRAMEWORK_NAME} instance
      - DB_TYPE=${DB_TYPE:-mariadb}
      - DB_HOST=${DB_HOST:-znuny-${FRAMEWORK_SLUG}-mariadb}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-${FRAMEWORK_NAME}}
      - DB_USER=${DB_USER:-${FRAMEWORK_NAME}}
      - DB_PASSWORD=${DB_PASSWORD:-${FRAMEWORK_NAME}_password}
      # Znuny configuration
      - ZNUNY_PORT=${FRAMEWORK_PORT}
      # Environment-specific settings
      - FRAMEWORK_NAME=${FRAMEWORK_NAME}
      - ZNUNY_USE_MOD_PERL=${ZNUNY_USE_MOD_PERL:-false}
      - HOST_UID=${HOST_UID:-}
      - HOST_GID=${HOST_GID:-}
      - ENABLE_SELENIUM=${ENABLE_SELENIUM:-n}
      - ZNUNY_CONTAINER_NAME=znuny-${FRAMEWORK_SLUG}-instance
    depends_on:
      - znuny-${FRAMEWORK_SLUG}-mariadb
    networks:
      - znuny-${FRAMEWORK_SLUG}-network
    restart: unless-stopped

  # ===== DATABASE SERVICES FOR ${FRAMEWORK_NAME} INSTANCE =====

  # MariaDB for ${FRAMEWORK_NAME} Instance
  znuny-${FRAMEWORK_SLUG}-mariadb:
    image: mariadb:10.11
    container_name: znuny-${FRAMEWORK_SLUG}-mariadb
    ports:
      - "${MARIADB_PORT}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:-root_${FRAMEWORK_NAME}}
      - MYSQL_DATABASE=${MARIADB_DATABASE:-${FRAMEWORK_NAME}}
      - MYSQL_USER=${MARIADB_USER:-${FRAMEWORK_NAME}}
      - MYSQL_PASSWORD=${MARIADB_PASSWORD:-${FRAMEWORK_NAME}_password}
      - MYSQL_CHARSET=utf8mb4
      - MYSQL_COLLATION=utf8mb4_unicode_ci
    volumes:
      - ${FRAMEWORK_SLUG}-mariadb-data:/var/lib/mysql
      - "{{CONFIGS_DIR}}/mariadb:/etc/mysql/conf.d:ro"
    networks:
      - znuny-${FRAMEWORK_SLUG}-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

# Named volumes for persistent data
volumes:
  # ${FRAMEWORK_NAME} instance volumes
  ${FRAMEWORK_SLUG}-data:
    driver: local
  ${FRAMEWORK_SLUG}-mariadb-data:
    driver: local

# Network configuration
networks:
  znuny-${FRAMEWORK_SLUG}-network:
    name: znuny-${FRAMEWORK_SLUG}-network
    external: true
